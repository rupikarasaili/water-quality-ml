<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Water Quality — Classification Demo</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>
  <header><h1>Water Quality — Classification</h1></header>
  <main class="container">
    <section class="card">
      <h2>Inputs</h2>
      <div id="inputs" class="grid"></div>
      <div class="row">
        <button id="predict">Predict</button>
        <button id="reset" class="ghost">Reset</button>
      </div>
      <details>
        <summary>Paste a CSV row (20 numbers)</summary>
        <textarea id="csv" rows="3" placeholder="v1, v2, …, v20"></textarea>
        <button id="loadCsv" class="ghost">Load row</button>
      </details>
    </section>

    <section class="card">
      <h2>Result</h2>
      <div class="result">
        <div><span class="k">Predicted class:</span> <span id="predClass" class="v">—</span></div>
        <div><span class="k">Probability (class 1):</span> <span id="prob1" class="v">—</span></div>
      </div>
      <div class="bars">
        <div class="bar"><div class="bar-fill" id="p0"></div><span>Class 0</span></div>
        <div class="bar"><div class="bar-fill" id="p1"></div><span>Class 1</span></div>
      </div>
    </section>
  </main>
  <footer><a id="status">Loading model…</a></footer>
  <script src="app.js"></script>
</body>
</html>
